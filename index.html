<script>
/* ================= اتصال به Supabase (پایگاه‌داده‌ی ابری؛ بدون اینترنت و ورود معتبر چیزی کار نمی‌کند) ================= */
const SUPA_URL='https://kskipnhpcxrcgpghurct.supabase.co';
const SUPA_KEY='sb_publishable_oYXKVBx7Zd04UuKWcEmpbQ_s70EI1iJ';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
let PROFILE=null,SESSION=null;

/* ================= CORE (بدون وابستگی به صفحه) ================= */
const CLASSES=["ریاضی 1","ریاضی 2","انسانی"];
const COMP={morning:"آزمون صبحگاهی",weekly:"آزمون تشریحی",study:"ساعت مطالعه",logging:"ثبت مطالعه",quality:"کیفیت مطالعه",classroom:"عملکرد کلاسی"};
const CKEY={morning:'morningScore',weekly:'weeklyScore',study:'studyScore',logging:'loggingScore',quality:'qualityScore',classroom:'classroomScore'};
const JM=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const DEF_CFG={weights:{morning:15,weekly:20,study:20,logging:10,quality:15,classroom:20},goal:2,goalByClass:{},thresholds:{excellent:85,good:70,attention:55},drop:10,penalty:5,
  cardMsg:{
    e:{t:'عالی پیش می‌روی! 🌟',s:'همین‌طور با انگیزه ادامه بده، نتیجه عالی گرفتی.'},
    g:{t:'خوب کار می‌کنی 💪',s:'با کمی تلاش بیشتر، این ماه از هر ماه بهتر می‌شه.'},
    a:{t:'جای پیشرفت داری 🙂',s:'چند نکته‌ی کوچک هست که با تمرکز روی آن‌ها نتیجه بهتر می‌شه.'},
    f:{t:'این ماه فرصت شروع دوباره‌ست 🤝',s:'با کمک معلم‌ها و کمی برنامه‌ریزی، ماه بعد بهتر می‌شه.'},
    u:{t:'داده کافی برای این ماه ثبت نشده',s:'لطفاً ثبت روزانه‌ی خودت را جدی‌تر دنبال کن.'}
  }};
let S=null, CACHE={}, MONTHS=null;

function newState(){return {v:1,students:[],groups:[],days:{},exams:[],actions:[],cfg:JSON.parse(JSON.stringify(DEF_CFG))};}
function markSaved(ok){
  CACHE={};MONTHS=null;
  const el=document.getElementById('saved');
  if(el)el.textContent=ok?('✓ ذخیره شد '+new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})):'⚠️ خطا در ذخیره';
}
function netErr(e){console.error(e);toast('⚠️ خطا در ارتباط با سرور — تغییرات ذخیره نشد. اتصال اینترنت را بررسی کنید.');markSaved(false);}

/* بارگذاری کامل داده‌ها از Supabase پس از ورود موفق؛ این سامانه هیچ داده‌ی واقعی را در localStorage نگه نمی‌دارد
   و بدون نشست کاربری معتبر و اتصال اینترنت هیچ داده‌ای نمایش داده نمی‌شود. */
async function loadFromSupabase(){
  S=newState();
  const [gq,sq,dq,eq,esq,aq,cq]=await Promise.all([
    sb.from('groups').select('*'),
    sb.from('students').select('*'),
    sb.from('days').select('*'),
    sb.from('exams').select('*'),
    sb.from('exam_scores').select('*'),
    sb.from('actions').select('*'),
    sb.from('cfg').select('*').eq('id',1).maybeSingle()
  ]);
  for(const r of [gq,sq,dq,eq,esq,aq,cq]) if(r.error) throw r.error;
  S.groups=(gq.data||[]).map(g=>({id:g.id,name:g.name}));
  S.students=(sq.data||[]).map(s=>({id:s.id,name:s.name,cls:s.cls,active:s.active,goal:s.goal==null?'':s.goal,group_id:s.group_id}));
  S.students.sort((a,b)=>a.name.localeCompare(b.name,'fa'));
  (dq.data||[]).forEach(r=>{
    const date=r.date,sid=r.student_id,rec={};
    if(r.qa)rec.qa=1; else if(r.q!=null)rec.q=r.q;
    if(r.h!=null)rec.h=r.h;
    if(r.s!=null)rec.s=r.s;
    if(r.lg!=null)rec.lg=r.lg?1:0;
    if(r.hw!=null)rec.hw=r.hw;
    if(r.ex!=null)rec.ex=r.ex;
    if(Object.keys(rec).length){S.days[date]=S.days[date]||{};S.days[date][sid]=rec;}
  });
  const byExam={};
  (esq.data||[]).forEach(r=>{(byExam[r.exam_id]=byExam[r.exam_id]||{})[r.student_id]=r.score;});
  S.exams=(eq.data||[]).map(e=>({id:e.id,date:e.date,title:e.title,type:e.type,subject:e.subject,total:e.total,scores:byExam[e.id]||{}}));
  S.actions=(aq.data||[]).map(a=>({id:a.id,sid:a.student_id,date:a.date,problem:a.problem,action:a.action,owner:a.owner,status:a.status,result:a.result}));
  S.cfg=Object.assign({},DEF_CFG,(cq.data&&cq.data.data)||{});
  CACHE={};MONTHS=null;
}

/* ---- عملیات ذخیره‌سازی هدفمند: فقط همان رکورد تغییر‌یافته به Supabase فرستاده می‌شود ---- */
async function remoteSaveDay(date,sid,rec){
  rec=rec||{};
  if(!Object.keys(rec).length){
    const {error}=await sb.from('days').delete().eq('student_id',sid).eq('date',date);
    if(error)throw error; return;
  }
  const row={student_id:sid,date,q:rec.q!=null?rec.q:null,qa:!!rec.qa,h:rec.h!=null?rec.h:null,s:rec.s!=null?rec.s:null,lg:rec.lg==null?null:!!rec.lg,hw:rec.hw!=null?rec.hw:null,ex:rec.ex!=null?rec.ex:null};
  const {error}=await sb.from('days').upsert(row,{onConflict:'student_id,date'});
  if(error)throw error;
}
async function remoteSaveExam(obj){
  const {error}=await sb.from('exams').upsert({id:obj.id,date:obj.date,title:obj.title,type:obj.type,subject:obj.subject,total:obj.total});
  if(error)throw error;
  const {error:de}=await sb.from('exam_scores').delete().eq('exam_id',obj.id);
  if(de)throw de;
  const rows=Object.entries(obj.scores||{}).map(([sid,score])=>({exam_id:obj.id,student_id:sid,score}));
  if(rows.length){const {error:ie}=await sb.from('exam_scores').insert(rows); if(ie)throw ie;}
}
async function remoteDeleteExam(id){ const {error}=await sb.from('exams').delete().eq('id',id); if(error)throw error; }
async function remoteSaveAction(obj){
  const {error}=await sb.from('actions').upsert({id:obj.id,student_id:obj.sid,date:obj.date,problem:obj.problem,action:obj.action,owner:obj.owner,status:obj.status,result:obj.result});
  if(error)throw error;
}
async function remoteDeleteAction(id){ const {error}=await sb.from('actions').delete().eq('id',id); if(error)throw error; }
async function remoteInsertStudent(s){
  const {error}=await sb.from('students').insert({id:s.id,name:s.name,cls:s.cls,group_id:s.group_id||null,active:true,goal:s.goal===''?null:s.goal});
  if(error)throw error;
}
async function remoteUpdateStudent(s,withGroup){
  const payload={name:s.name,cls:s.cls,goal:s.goal===''?null:s.goal,active:s.active};
  if(withGroup)payload.group_id=s.group_id||null;
  const {error}=await sb.from('students').update(payload).eq('id',s.id);
  if(error)throw error;
}
async function remoteSaveCfg(cfg){ const {error}=await sb.from('cfg').update({data:cfg}).eq('id',1); if(error)throw error; }

const fa=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});
const jmemo={};
function jparts(iso){
  if(jmemo[iso])return jmemo[iso];
  const p=fa.formatToParts(new Date(iso+'T12:00:00Z')).reduce((a,x)=>(a[x.type]=x.value,a),{});
  return jmemo[iso]={y:+p.year,m:+p.month,d:+p.day};
}
function monthOf(iso){const p=jparts(iso);return p.y+'-'+String(p.m).padStart(2,'0');}
function fa2(n){return String(n).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);}
function jdate(iso){const p=jparts(iso);return fa2(p.d)+' '+JM[p.m-1]+' '+fa2(p.y);}
function mlabel(m){const [y,mo]=m.split('-');return JM[+mo-1]+' '+fa2(y);}
function addM(m,d){let [y,mo]=m.split('-').map(Number);mo+=d;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return y+'-'+String(mo).padStart(2,'0');}

/* ---- تقویم شمسی برای انتخاب تاریخ (کاملاً آفلاین، بر پایه‌ی همان تقویم فارسی مرورگر) ---- */
const JYCACHE={};
function jalaliYearMap(jy){
  if(JYCACHE[jy])return JYCACHE[jy];
  const map={};for(let m=1;m<=12;m++)map[m]=[];
  const startGuess=new Date(Date.UTC(jy+621,0,25)); // ۲۵ ژانویه سال گرگوریِ آغاز سال شمسی، حاشیه امن پیش از نوروز
  for(let i=0;i<420;i++){
    const d=new Date(startGuess.getTime()+i*86400000);
    const iso=d.toISOString().slice(0,10);
    const p=jparts(iso);
    if(p.y===jy)map[p.m].push(iso);
    else if(p.y>jy)break;
  }
  return JYCACHE[jy]=map;
}
function jalaliMonthDates(jy,jm){return jalaliYearMap(jy)[jm]||[];}
function isoOf(id){const el=$(id);return el?(el.dataset.iso||todayISO()):todayISO();}
function jalaliInputHTML(id,iso){return '<input type="text" id="'+id+'" class="jdate" data-iso="'+iso+'" value="'+jdate(iso)+'" readonly placeholder="انتخاب تاریخ">';}
function wireJalali(id,onPick){
  const inp=$(id);if(!inp)return;
  inp.addEventListener('click',()=>openJalaliPicker(inp,onPick));
  inp.addEventListener('keydown',e=>{ // باز شدن تقویم بدون ماوس: Enter، فاصله یا کلید جهت
    if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();openJalaliPicker(inp,onPick);
    }
  });
}
function openJalaliPicker(inputEl,onPick){
  let cur=jparts(inputEl.dataset.iso||todayISO()),jy=cur.y,jm=cur.m;
  const bg=document.createElement('div');bg.className='mbg';
  function focusGrid(){
    const sel=bg.querySelector('.jsel')||bg.querySelector('.jtoday')||bg.querySelector('.jdcell');
    if(sel)sel.focus();
  }
  function render(keepFocus){
    const dates=jalaliMonthDates(jy,jm);
    let cells='';
    if(dates.length){
      const wd=(new Date(dates[0]+'T12:00:00Z').getUTCDay()+1)%7; // ۰=شنبه
      for(let i=0;i<wd;i++)cells+='<div></div>';
      dates.forEach((iso,i)=>{
        const d=i+1,isToday=iso===todayISO(),isSel=iso===inputEl.dataset.iso;
        cells+='<button type="button" class="jdcell'+(isToday?' jtoday':'')+(isSel?' jsel':'')+'" data-iso="'+iso+'">'+fa2(d)+'</button>';
      });
    }
    bg.innerHTML=`<div class="modal" style="max-width:330px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <button class="btn" id="jprev" type="button">‹ ماه قبل</button>
        <b>${JM[jm-1]} ${fa2(jy)}</b>
        <button class="btn" id="jnext" type="button">ماه بعد ›</button>
      </div>
      <div class="jgrid" style="font-size:11px;color:var(--mu);margin-bottom:4px;text-align:center">
        ${['ش','ی','د','س','چ','پ','ج'].map(x=>'<div>'+x+'</div>').join('')}
      </div>
      <div class="jgrid">${cells||'<div class="mu" style="grid-column:1/-1;text-align:center;padding:10px">در حال بارگذاری…</div>'}</div>
      <div class="btn-row" style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="jtoday" type="button">امروز</button><button class="btn" id="jclose" type="button">بستن</button></div>
      <div class="mu" style="margin-top:8px;font-size:11px">با کلیدهای جهت‌دار بین روزها حرکت کنید، Enter برای انتخاب، PageUp/PageDown برای تغییر ماه، Esc برای بستن.</div>
    </div>`;
    bg.querySelector('#jprev').onclick=()=>{jm--;if(jm<1){jm=12;jy--;}render();};
    bg.querySelector('#jnext').onclick=()=>{jm++;if(jm>12){jm=1;jy++;}render();};
    bg.querySelector('#jtoday').onclick=()=>{const t=todayISO();inputEl.dataset.iso=t;inputEl.value=jdate(t);bg.remove();if(onPick)onPick(t);};
    bg.querySelector('#jclose').onclick=()=>bg.remove();
    bg.querySelectorAll('.jdcell').forEach(b=>b.onclick=()=>{const iso=b.dataset.iso;inputEl.dataset.iso=iso;inputEl.value=jdate(iso);bg.remove();if(onPick)onPick(iso);});
    if(keepFocus!==false)focusGrid();
  }
  bg.addEventListener('keydown',e=>{ // پیمایش تقویم فقط با صفحه‌کلید (بدون نیاز به ماوس)
    const act=document.activeElement;
    if(e.key==='PageDown'){e.preventDefault();jm++;if(jm>12){jm=1;jy++;}render();return;}
    if(e.key==='PageUp'){e.preventDefault();jm--;if(jm<1){jm=12;jy--;}render();return;}
    if(!act||!act.classList||!act.classList.contains('jdcell'))return;
    let delta=0;
    if(e.key==='ArrowLeft')delta=1; // چیدمان راست‌به‌چپ: چپ یعنی روز بعد
    else if(e.key==='ArrowRight')delta=-1;
    else if(e.key==='ArrowDown')delta=7;
    else if(e.key==='ArrowUp')delta=-7;
    else return;
    e.preventDefault();
    const d=new Date(act.dataset.iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+delta);
    const niso=d.toISOString().slice(0,10),p=jparts(niso);
    if(p.y!==jy||p.m!==jm){jy=p.y;jm=p.m;render(false);}
    const btn=bg.querySelector('.jdcell[data-iso="'+niso+'"]');
    if(btn)btn.focus();
  });
  render();document.body.appendChild(bg);focusGrid();
}
function todayISO(){return new Date().toISOString().slice(0,10);}
function monthList(){
  if(!MONTHS){const s=new Set([monthOf(todayISO())]);Object.keys(S.days).forEach(d=>s.add(monthOf(d)));S.exams.forEach(e=>s.add(monthOf(e.date)));MONTHS=[...s].sort().reverse();}
  return MONTHS;
}
function datesOf(m){return Object.keys(S.days).filter(d=>monthOf(d)===m);}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sum=a=>a.reduce((x,y)=>x+y,0);
const r1=n=>n==null?null:Math.round(n*10)/10;
const F=n=>n==null?'—':r1(n);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stById=id=>S.students.find(s=>s.id===id);
const active=()=>S.students.filter(s=>s.active!==false);
function goalOf(st){
  if(st.goal!=null&&st.goal!=='')return +st.goal;
  const c=S.cfg.goalByClass[st.cls]; if(c!=null&&c!=='')return +c;
  return S.cfg.goal;
}

function compute(sid,m){
  const key=sid+'|'+m; if(CACHE[key])return CACHE[key];
  const st=stById(sid), cfg=S.cfg;
  const dates=datesOf(m);
  const recs=dates.map(d=>S.days[d][sid]).filter(Boolean);
  const qs=recs.filter(r=>r.q!=null&&!r.qa).map(r=>r.q);
  const morning=qs.length?avg(qs):null;
  const ex=S.exams.filter(e=>monthOf(e.date)===m&&e.scores&&e.scores[sid]!=null&&e.total>0).map(e=>({t:e.type,p:e.scores[sid]/e.total*100}));
  const gen=ex.filter(e=>e.t==='general').map(e=>e.p), spe=ex.filter(e=>e.t==='specialized').map(e=>e.p);
  const weekly=ex.length?avg(ex.map(e=>e.p)):null;
  const hs=recs.filter(r=>r.h!=null).map(r=>r.h);
  const avgH=hs.length?avg(hs):null, goal=st?goalOf(st):cfg.goal;
  const study=avgH!=null&&goal>0?Math.min(100,avgH/goal*100):null;
  const ss=recs.filter(r=>r.s!=null).map(r=>r.s);
  const quality=ss.length?avg(ss)/3*100:null;
  const lg=recs.filter(r=>r.lg===0||r.lg===1);
  const logging=lg.length?sum(lg.map(r=>r.lg))/lg.length*100:null;
  const hw=recs.filter(r=>r.hw===0||r.hw===1);
  const hwRate=hw.length?avg(hw.map(r=>r.hw))*100:null;
  const exp=sum(recs.map(r=>r.ex||0));
  const hasCls=hw.length||recs.some(r=>r.ex!=null);
  const classroom=hwRate!=null?Math.max(0,hwRate-exp*cfg.penalty):(hasCls?Math.max(0,100-exp*cfg.penalty):null);
  const comps={morning,weekly,study,logging,quality,classroom};
  const av=Object.entries(comps).filter(([k,v])=>v!=null);
  const tw=sum(av.map(([k])=>cfg.weights[k]||0));
  const overall=tw>0?sum(av.map(([k,v])=>v*(cfg.weights[k]||0)))/tw:null;
  return CACHE[key]={sid,m,morningScore:morning,generalScore:gen.length?avg(gen):null,specialScore:spe.length?avg(spe):null,weeklyScore:weekly,studyScore:study,loggingScore:logging,qualityScore:quality,classroomScore:classroom,overall,completeness:Math.round(av.length/6*100),hwRate,exp,avgH,goal,absent:recs.filter(r=>r.qa).length};
}
function classify(o){
  const t=S.cfg.thresholds;
  if(o==null)return{l:'داده ناکافی',c:'u'};
  if(o>=t.excellent)return{l:'عالی',c:'e'};
  if(o>=t.good)return{l:'خوب',c:'g'};
  if(o>=t.attention)return{l:'نیاز به توجه',c:'a'};
  return{l:'نیازمند پیگیری',c:'f'};
}
function weak(r){return Object.keys(COMP).filter(k=>r[CKEY[k]]!=null&&r[CKEY[k]]<S.cfg.thresholds.attention).map(k=>COMP[k]);}
function reasons(sid,m){
  const c=compute(sid,m),p=compute(sid,addM(m,-1)),cf=S.cfg,out=[],w=weak(c);
  if(c.overall!=null&&c.overall<cf.thresholds.attention)out.push('امتیاز کلی پایین ('+F(c.overall)+')');
  if(w.length>=2)out.push('چند شاخص ضعیف: '+w.join('، '));
  if(c.overall!=null&&p.overall!=null&&p.overall-c.overall>=cf.drop)out.push('افت '+F(p.overall-c.overall)+' امتیازی نسبت به ماه قبل');
  if(c.studyScore!=null&&p.studyScore!=null&&p.studyScore-c.studyScore>=cf.drop)out.push('کاهش ساعت مطالعه نسبت به ماه قبل');
  if(c.loggingScore!=null&&c.loggingScore<cf.thresholds.attention)out.push('ثبت نامنظم دفتر مطالعه');
  if(c.exp>p.exp)out.push('افزایش اخراج از کلاس ('+p.exp+' ← '+c.exp+')');
  if(c.weeklyScore!=null&&p.weeklyScore!=null&&p.weeklyScore-c.weeklyScore>=cf.drop)out.push('کاهش عملکرد آزمون‌های تشریحی');
  if(c.morningScore!=null&&p.morningScore!=null&&p.morningScore-c.morningScore>=cf.drop)out.push('کاهش عملکرد آزمون صبحگاهی');
  return out;
}
function uid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2,10));}

/* ---- وارد کردن نمرات آزمون صبحگاهی از اکسل (چسباندن یا فایل CSV) ---- */
function normDigits(s){
  return String(s)
    .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}
function parsePercentCell(raw){
  let t=(raw||'').trim();
  if(t===''||t==='-'||t==='غ'||t==='غایب'||t.toLowerCase()==='absent')return{absent:true};
  t=normDigits(t).replace(/[٪%]/g,'').trim();
  const num=parseFloat(t);
  if(isNaN(num)||num>100)return{invalid:true};
  return{value:Math.round(num*10)/10};
}
/* فرمت ورود ساعت مطالعه: اول ساعت، سپس نقطه، سپس دقیقه (مثلاً 1.30 یعنی یک ساعت و سی دقیقه) — نه عدد اعشاری معمولی */
function parseHM(raw){
  let t=normDigits((raw||'').trim());
  if(t==='')return null;
  if(!/^\d{1,2}(\.\d{1,2})?$/.test(t))return{invalid:true};
  const parts=t.split('.');
  const h=parseInt(parts[0],10);
  const m=parts[1]!=null?parseInt(parts[1],10):0;
  if(isNaN(h)||h<0||h>24||isNaN(m)||m<0||m>59||(h===24&&m>0))return{invalid:true};
  return{value:h+m/60};
}
function formatHM(decimal){
  if(decimal==null||isNaN(decimal))return'';
  let h=Math.floor(decimal),m=Math.round((decimal-h)*60);
  if(m===60){h+=1;m=0;}
  return m===0?String(h):h+'.'+String(m).padStart(2,'0');
}
function normName(s){
  return String(s||'')
    .replace(/[‌‍‎‏]/g,'')
    .replace(/[يى]/g,'ی').replace(/ك/g,'ک')
    .replace(/\s+/g,' ').trim().toLowerCase();
}
function matchStudentByName(name){
  const n=normName(name);
  if(!n)return{sid:null};
  const matches=S.students.filter(s=>normName(s.name)===n);
  if(matches.length===1)return{sid:matches[0].id};
  if(matches.length>1)return{sid:matches[0].id,ambiguous:true};
  return{sid:null};
}
function buildImportPreview(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  return lines.map(line=>{
    let parts=line.split('\t');
    if(parts.length<2)parts=line.split(',');
    if(parts.length<2)parts=line.split(/\s{2,}/);
    const name=(parts[0]||'').trim(),pctRaw=(parts.slice(1).join(' ')||'').trim();
    const match=matchStudentByName(name),pr=parsePercentCell(pctRaw);
    return{name,pctRaw,sid:match.sid,ambiguous:match.ambiguous,absent:pr.absent||false,value:pr.value!=null?pr.value:null,invalid:!!pr.invalid};
  }).filter(r=>r.name);
}

    <div class="btn-row" style="display:flex;gap:8px;margin-top:8px"><button class="btn p" id="impParse">بررسی و پیش‌نمایش</button><button class="btn" id="impNo">انصراف</button></div>

  document.body.appendChild(bg);

  bg.querySelector('#impFile').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{bg.querySelector('#impTxt').value=r.result;};r.readAsText(f,'UTF-8');

  bg.querySelector('#impParse').onclick=()=>{

    rows=buildImportPreview(text);

  function renderPrev(){
    const box=bg.querySelector('#impPrev');
    if(!rows.length){box.innerHTML='<div class="mu">هیچ ردیف قابل‌خواندنی پیدا نشد.</div>';return;}
    const okCount=rows.filter(r=>r.sid&&!r.invalid).length;
    box.innerHTML=`
      <div class="mu" style="margin-bottom:6px">${fa2(okCount)} از ${fa2(rows.length)} ردیف آماده‌ی ثبت است. ردیف‌های بدون تطبیق را از فهرست کشویی دستی انتخاب کنید یا نادیده بگیرید.</div>
      <div class="tw" style="max-height:300px"><table><thead><tr><th>نام در فایل</th><th>مقدار</th><th>وضعیت</th><th>تطبیق با دانش‌آموز</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr data-i="${i}">
        <td>${esc(r.name)}</td>
        <td>${r.invalid?'<span style="color:var(--bad)">نامعتبر: '+esc(r.pctRaw)+'</span>':(r.absent?'غایب':fa2(r.value)+'٪')}</td>
        <td>${r.sid?(r.ambiguous?'<span style="color:var(--wa)">چند تطبیق</span>':'<span style="color:var(--ok)">تطبیق یافت</span>'):'<span style="color:var(--bad)">یافت نشد</span>'}</td>
        <td><select class="impSel" data-i="${i}"><option value="">— نادیده بگیر —</option>${S.students.map(s=>'<option value="'+s.id+'"'+(r.sid===s.id?' selected':'')+'>'+esc(s.name)+(s.active===false?' (غیرفعال)':'')+'</option>').join('')}</select></td>
      </tr>`).join('')}

    `;
    box.querySelectorAll('.impSel').forEach(sel=>sel.onchange=e=>{rows[+e.target.dataset.i].sid=e.target.value||null;});
    box.querySelector('#impApply').onclick=async()=>{
      const d=isoOf('impD');
      if(!d){toast('تاریخ نامعتبر است');return;}
      const usable=rows.filter(r=>r.sid&&!r.invalid);
      if(!usable.length){toast('هیچ ردیف قابل‌ثبتی انتخاب نشده.');return;}
      let dup=false;const seen=new Set();
      const day={...(S.days[d]||{})};
      usable.forEach(r=>{
        if(seen.has(r.sid))dup=true;seen.add(r.sid);

      });
      const btn=box.querySelector('#impApply');btn.disabled=true;
      try{ await Promise.all([...seen].map(sid=>remoteSaveDay(d,sid,day[sid]))); }
      catch(e){ netErr(e); btn.disabled=false; return; }
      if(Object.keys(day).length)S.days[d]=day;else delete S.days[d];
      markSaved(true);bg.remove();
      toast(fa2(usable.length)+' نمره ثبت شد'+(dup?' (برخی نام‌ها تکراری بودند؛ آخرین مقدار اعمال شد)':'')+' ✓');
      entDaily(d,cls);
    };
  }
}

function line(labels,vals){
  const W=520,H=170,P=28,n=labels.length,xs=i=>P+i*(W-2*P)/Math.max(1,n-1),ys=v=>H-P-(v/100)*(H-2*P);
  let pts=vals.map((v,i)=>v==null?null:[xs(i),ys(v)]);
  let g='',path='',pen=false;
  [0,50,100].forEach(v=>g+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+ys(v)+'" y2="'+ys(v)+'" stroke="#e3e7ee"/><text x="4" y="'+(ys(v)+4)+'" font-size="10" fill="#6b7684">'+v+'</text>');
  pts.forEach(p=>{if(!p){pen=false;return;}path+=(pen?'L':'M')+p[0]+' '+p[1]+' ';pen=true;});
  const dots=pts.map((p,i)=>p?'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="#2f5fd8"/><text x="'+p[0]+'" y="'+(p[1]-8)+'" font-size="10" text-anchor="middle" fill="#1c2430">'+r1(vals[i])+'</text>':'').join('');
  const lb=labels.map((l,i)=>'<text x="'+xs(i)+'" y="'+(H-8)+'" font-size="10" text-anchor="middle" fill="#6b7684">'+esc(l)+'</text>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+g+'<path d="'+path+'" fill="none" stroke="#2f5fd8" stroke-width="2"/>'+dots+lb+'</svg>';
}

function entDaily(date,cls){

   <div class="tw" style="max-height:68vh"><table><thead><tr><th>نام</th><th>آزمون صبحگاهی ٪</th><th>غایب</th><th>ساعت مطالعه</th><th>ستاره (۰–۳)</th><th>دفتر مطالعه</th><th>تکلیف</th><th>اخراج</th><th></th></tr></thead><tbody>
   ${st.map(s=>{const r=day[s.id]||{};return '<tr data-id="'+s.id+'" data-nm="'+esc(s.name)+'"><td>'+esc(s.name)+'</td>'
    +'<td><input type="number" max="100" step="0.5" class="q" value="'+(r.q!=null?r.q:'')+'"></td>'

  const COLS=['q','qa','h','s','lg','hw','ex'];
  function nextRowCell(tr,col){ // ردیف قابل‌مشاهده‌ی بعدی در همان ستون (برای ورود سریع ستونی، مثل آزمون صبحگاهی)
    let n=tr.nextElementSibling;
    while(n && n.style.display==='none')n=n.nextElementSibling;
    return n ? n.querySelector('.'+col) : null;
  }
  document.querySelectorAll('#ent tbody tr').forEach(tr=>{ // ثبت خودکار «دفتر ثبت شد» با وارد کردن ساعت/ستاره
    const auto=()=>{const l=tr.querySelector('.lg');if(l.value==='')l.value='1';};
    tr.querySelector('.h').addEventListener('input',auto);tr.querySelector('.s').addEventListener('change',auto);
    tr.querySelector('.qa').addEventListener('change',e=>{if(e.target.checked)tr.querySelector('.q').value='';});
    tr.querySelector('.q').addEventListener('input',e=>{if(e.target.value!=='')tr.querySelector('.qa').checked=false;});
    COLS.forEach(col=>{
      const el=tr.querySelector('.'+col); if(!el)return;
      el.addEventListener('keydown',e=>{
        if(e.key==='Enter'){ e.preventDefault();
          const nx=nextRowCell(tr,col);
          if(nx){ nx.focus(); if(nx.select) nx.select(); }
          else if(col===COLS[COLS.length-1]){ $('sv').click(); } // پایان آخرین ستون در آخرین ردیف = ذخیره خودکار
        }
      });
      if(el.tagName==='SELECT'||el.type==='checkbox'){ // انتخاب از لیست هم خودکار به سطر بعدی همان ستون برود
        el.addEventListener('change',()=>{ const nx=nextRowCell(tr,col); if(nx){ nx.focus(); if(nx.select) nx.select(); } });
      }
    });
  });
  { // فوکوس خودکار روی اولین خانه‌ی قابل‌مشاهده برای شروع ورود اطلاعات بدون نیاز به ماوس

      const id=tr.dataset.id,nm=stById(id).name,g=c=>tr.querySelector(c).value,r={};

      if(g('.s')!=='')r.s=+g('.s');

      if(g('.hw')!=='')r.hw=+g('.hw');

    if(!changed.length){toast('تغییری برای ذخیره نبود.');return;}
    $('sv').disabled=true;
    try{ await Promise.all(changed.map(([id,r])=>remoteSaveDay(d,id,r))); }
    catch(e){ netErr(e); $('sv').disabled=false; return; }
    if(Object.keys(rec).length)S.days[d]=rec;else delete S.days[d];
    markSaved(true);toast('ذخیره شد ✓');$('sv').disabled=false;
  };
}

  { const firstSc=document.querySelector('#ent tbody tr[data-id] .sc'); if(firstSc) firstSc.focus(); }
  $('xsv').onclick=async()=>{
    const d=isoOf('xd'),t=$('xt').value.trim(),tot=+$('xm').value,sc={},errs=[];
    if(!d||!t){toast('تاریخ و عنوان لازم است');return;}

    document.querySelectorAll('#ent tr[data-id]').forEach(tr=>{const v=tr.querySelector('.sc').value;if(v==='')return;const n=+v;

async function delExam(id){
  if(!confirm('این آزمون حذف شود؟'))return;

  S.exams=S.exams.filter(x=>x.id!==id);markSaved(true);entExam();
}

function fieldSummary(iso,sid){
  const r=(S.days[iso]||{})[sid]; if(!r)return[];
  const p=[];
  if(r.qa)p.push('آزمون صبحگاهی: غایب'); else if(r.q!=null)p.push('آزمون صبحگاهی: '+r.q+'٪');
  if(r.h!=null)p.push('مطالعه: '+r.h+' ساعت');
  if(r.s!=null)p.push('کیفیت مطالعه: '+r.s+'⭐');
  if(r.lg===1)p.push('دفتر مطالعه: ثبت شد'); else if(r.lg===0)p.push('دفتر مطالعه: ثبت نشد');
  if(r.hw===1)p.push('تکلیف: انجام داد'); else if(r.hw===0)p.push('تکلیف: انجام نداد');
  if(r.ex)p.push('اخراج: '+r.ex+' بار');
  return p;
}
function fieldCount(iso,sid){
  const r=(S.days[iso]||{})[sid]; if(!r)return 0;
  let n=0; if(r.q!=null||r.qa)n++; if(r.h!=null||r.s!=null||r.lg!=null)n++; if(r.hw!=null||r.ex)n++; return n;
}
function cellColor(n){return n===0?'#eef0f3':n===1?'#cfe0fb':n===2?'#8fb6f3':'#2f5fd8';}

function actModal(sid,aid){

  <div class="row"><div class="f"><label>نتیجه</label><textarea id="ar" rows="2">${esc(a.result)}</textarea></div></div>
  <div style="display:flex;gap:8px"><button class="btn p" id="ok">ذخیره</button><button class="btn" id="no">انصراف</button>${aid?'<button class="btn d" id="dl">حذف</button>':''}</div></div>`;
  document.body.appendChild(bg);bg.querySelector('#no').onclick=()=>bg.remove();
  wireJalali('ad');
  if(aid)bg.querySelector('#dl').onclick=async()=>{
    if(!confirm('حذف شود؟'))return;
    try{ await remoteDeleteAction(aid); }catch(e){ netErr(e); return; }
    S.actions=S.actions.filter(x=>x.id!==aid);markSaved(true);bg.remove();vFollow();
  };
  bg.querySelector('#ok').onclick=async()=>{
    const o={id:a.id||uid(),sid:$('as').value,date:isoOf('ad'),problem:$('ap').value.trim(),action:$('aa').value.trim(),owner:$('ao').value.trim(),status:$('at').value,result:$('ar').value.trim()};

    const okBtn=bg.querySelector('#ok');okBtn.disabled=true;

    if(aid)S.actions[S.actions.findIndex(x=>x.id===aid)]=o;else S.actions.push(o);
    markSaved(true);bg.remove();vFollow();
  };
}

  <div class="card"><h3>راهنمای کوتاه</h3><ol class="r"><li>«ثبت داده»: هر روز یک جدول برای همه دانش‌آموزان پر کنید؛ برای ورود سریع در هر ستون، عدد را بنویسید و Enter بزنید تا به سطر بعدی همان ستون بروید، سپس یک‌بار «ذخیره همه» بزنید. آزمون‌های تشریحی هم همین‌طور.</li><li>دکمه‌ی «📥 وارد کردن آزمون صبحگاهی از اکسل» در بالای جدول ثبت روزانه: دو ستون «نام» و «درصد» را در اکسل کپی کنید و در پنجره‌ی باز شده بچسبانید (یا فایل CSV اکسل را انتخاب کنید)؛ سامانه نام‌ها را با فهرست دانش‌آموزان تطبیق می‌دهد و پیش از ثبت نهایی، پیش‌نمایش و امکان اصلاح دستی نام‌های تطبیق‌نیافته را نشان می‌دهد.</li><li>«داشبورد و گزارش»: وضعیت مدرسه و گزارش ماهانه؛ روی نام هر دانش‌آموز بزنید تا گزارش فردی باز و قابل چاپ شود.</li><li>«پیگیری»: فهرست خودکار دانش‌آموزان نیازمند توجه و ثبت اقدامات.</li><li>زیرتب «🔍 نمای ثبت‌ها» در «ثبت داده»: یک نمای کلی از روزهای ثبت‌شده‌ی هر دانش‌آموز در هر ماه، و جستجوی کامل تاریخچه‌ی یک دانش‌آموز برای پیدا کردن داده‌ای که اشتباهی در تاریخ نادرست ثبت شده.</li><li>برای حذف داده‌ی یک روز یا یک رکورد اشتباه، از دکمه‌های 🗑 در جدول ثبت روزانه یا در «نمای ثبت‌ها» استفاده کنید.</li></ol>
  <p class="mu" style="margin-top:10px;border-top:1px solid var(--bd);padding-top:8px">طراحی و ساخت: <b>امیرمحمد عزت‌پور</b> — تماس: ۰۹۹۳۴۲۹۶۱۹۱.</p></div>`;
  $('stq').oninput=e=>{const q=e.target.value.trim();document.querySelectorAll('#stbody tr[data-nm]').forEach(tr=>{tr.style.display=!q||tr.dataset.nm.includes(q)?'':'none';});};
  if(admin)$('svc').onclick=async()=>{
    const w={};let t=0;Object.keys(COMP).forEach(k=>{w[k]=+$('w_'+k).value||0;t+=w[k];});
    if(Math.round(t)!==100){alert('مجموع وزن‌ها '+t+' است؛ باید دقیقاً ۱۰۰ باشد.');return;}
    const t1=+$('t1').value,t2=+$('t2').value,t3=+$('t3').value;
    if(!(t1>t2&&t2>t3)){alert('ترتیب آستانه‌ها باید عالی > خوب > نیاز به توجه باشد.');return;}
    const gb={};CLASSES.forEach((x,i)=>{const v=$('gc'+i).value;if(v!=='')gb[x]=+v;});
    const cardMsg={};['e','g','a','f','u'].forEach(k=>{cardMsg[k]={t:$('cmt_'+k).value.trim(),s:$('cms_'+k).value.trim()};});
    const cfg=Object.assign({},S.cfg,{weights:w,goal:+$('gd').value||2,goalByClass:gb,thresholds:{excellent:t1,good:t2,attention:t3},drop:+$('dr').value||10,penalty:+$('pn').value||0,cardMsg});
    $('svc').disabled=true;
    try{ await remoteSaveCfg(cfg); }catch(e){ netErr(e); $('svc').disabled=false; return; }
    S.cfg=cfg;markSaved(true);toast('تنظیمات ذخیره شد ✓');$('svc').disabled=false;
  };
}
function stModal(id){
  if(!id&&!isAdmin())return;
  const s=id?stById(id):{name:'',cls:CLASSES[0],goal:'',active:true,group_id:''};
  const admin=isAdmin();
  const bg=document.createElement('div');bg.className='mbg';
  bg.innerHTML=`<div class="modal"><h3>${id?'ویرایش':'افزودن'} دانش‌آموز</h3>
  <div class="row"><div class="f"><label>نام و نام‌خانوادگی</label><input id="sn" value="${esc(s.name)}"${admin?'':' disabled'}></div></div>
  <div class="row"><div class="f"><label>کلاس/رشته</label><select id="sc">${CLASSES.map(c=>'<option'+(s.cls===c?' selected':'')+'>'+c+'</option>').join('')}</select></div>
  <div class="f"><label>هدف مطالعه اختصاصی (ساعت، اختیاری)</label><input type="number" step="0.25" id="sg" value="${s.goal??''}"></div></div>
  ${admin?'<div class="row"><div class="f"><label>زیرگروه (مسئول)</label><select id="sgr"><option value="">— بدون زیرگروه —</option>'+(S.groups||[]).map(g=>'<option value="'+g.id+'"'+(s.group_id===g.id?' selected':'')+'>'+esc(g.name)+'</option>').join('')+'</select></div></div>':''}
  ${id?'<label><input type="checkbox" id="sa" '+(s.active!==false?'checked':'')+'> فعال</label>':''}
  <div style="display:flex;gap:8px;margin-top:10px"><button class="btn p" id="ok">ذخیره</button><button class="btn" id="no">انصراف</button></div>
  ${id?'<p class="mu">برای حفظ سوابق، دانش‌آموز حذف نمی‌شود؛ فقط غیرفعال شود.</p>':''}</div>`;
  document.body.appendChild(bg);bg.querySelector('#no').onclick=()=>bg.remove();
  bg.querySelector('#ok').onclick=async()=>{
    const n=admin?$('sn').value.trim():s.name;if(!n){toast('نام را وارد کنید');return;}
    const o={id:id||uid(),name:n,cls:$('sc').value,goal:$('sg').value===''?'':+$('sg').value,active:id?$('sa').checked:true,group_id:admin?($('sgr')?$('sgr').value:s.group_id):s.group_id};
    const okBtn=bg.querySelector('#ok');okBtn.disabled=true;
    try{
      if(id)await remoteUpdateStudent(o,admin);else await remoteInsertStudent(o);
    }catch(e){ netErr(e); okBtn.disabled=false; return; }
    if(id)S.students[S.students.findIndex(x=>x.id===id)]=Object.assign({},s,o);else S.students.push(o);
    S.students.sort((a,b)=>a.name.localeCompare(b.name,'fa'));markSaved(true);bg.remove();vManage();
  };
}
function bulkModal(){
  if(!isAdmin())return;
  const bg=document.createElement('div');bg.className='mbg';
  bg.innerHTML=`<div class="modal"><h3>افزودن گروهی</h3><p class="mu">هر خط یک دانش‌آموز: «نام، کلاس». کلاس باید یکی از این‌ها باشد: ${CLASSES.join(' / ')}. (می‌توانید از Excel کپی کنید)</p><textarea id="bt" rows="10" placeholder="علی احمدی، ریاضی 1"></textarea><div style="display:flex;gap:8px;margin-top:10px"><button class="btn p" id="ok">افزودن</button><button class="btn" id="no">انصراف</button></div></div>`;
  document.body.appendChild(bg);bg.querySelector('#no').onclick=()=>bg.remove();
  bg.querySelector('#ok').onclick=async()=>{
    const bad=[],list=[];
    $('bt').value.split('\n').forEach(l=>{l=l.trim();if(!l)return;const p=l.split(/[,،\t]/).map(x=>x.trim());const cls=CLASSES.find(c=>c===p[1]);
      if(!p[0]||!cls){bad.push(l);return;}list.push({id:uid(),name:p[0],cls,active:true});});
    if(!list.length){toast('هیچ ردیف معتبری پیدا نشد.');return;}
    const okBtn=bg.querySelector('#ok');okBtn.disabled=true;
    try{ const {error}=await sb.from('students').insert(list.map(s=>({id:s.id,name:s.name,cls:s.cls,active:true}))); if(error)throw error; }
    catch(e){ netErr(e); okBtn.disabled=false; return; }
    S.students.push(...list);
    S.students.sort((a,b)=>a.name.localeCompare(b.name,'fa'));markSaved(true);bg.remove();vManage();
    toast(list.length+' دانش‌آموز اضافه شد'+(bad.length?' — '+bad.length+' خط نامعتبر رد شد':''));
  };
}
function doBackup(){
  const out={students:S.students,days:S.days,exams:S.exams,actions:S.actions,cfg:S.cfg,_app:'سامانه عملکرد تحصیلی مدرسه (نسخه فقط-خواندنی)',_creator:'امیرمحمد عزت‌پور',_contact:'09934296191',_note:'این فایل فقط برای مشاهده است و دیگر توسط سامانه قابل وارد کردن (import) نیست؛ منبع اصلی داده‌ها همیشه پایگاه‌داده‌ی ابری است.'};
  const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='school-export-'+todayISO()+'.json';document.body.appendChild(a);a.click();a.remove();
  toast('فایل دانلود شد ✓');
}

/* ---- احراز هویت و شروع (بدون نشست معتبر، هیچ داده‌ای از سرور لود نمی‌شود) ---- */
function showLogin(err){
  $('loadingGate').style.display='none';
  $('loginGate').style.display='flex';
  const el=$('loginErr');
  if(err){el.style.display='block';el.textContent=err;}else{el.style.display='none';}
}
async function afterLogin(session){
  SESSION=session;
  const {data:prof,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error||!prof){
    await sb.auth.signOut();
    showLogin('این حساب هنوز در سامانه تعریف نشده. با مدیر سامانه تماس بگیرید.');
    return;
  }
  PROFILE=prof;
  try{ await loadFromSupabase(); }
  catch(e){ console.error(e); showLogin('خطا در بارگذاری اطلاعات از سرور. اتصال اینترنت را بررسی کنید.'); return; }
  $('loadingGate').style.display='none';
  $('loginGate').style.display='none';
  $('whoami').textContent='👤 '+prof.display_name+(prof.role==='admin'?' (مدیر)':'');
  $('logoutBtn').style.display='';
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.t));
  document.addEventListener('mousedown',e=>{if(e.target.classList&&e.target.classList.contains('mbg'))e.target.remove();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=document.querySelector('.mbg:last-of-type');if(m)m.remove();}});
  show(S.students.length?'dash':'manage');
}
async function initAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showLogin();return;}
  await afterLogin(session);
}
if(typeof document!=='undefined'&&document.getElementById('view')){
  $('loBtn').onclick=async()=>{
    const raw=$('loE').value.trim(),pass=$('loP').value;
    if(!raw||!pass){showLogin('نام‌کاربری و رمز را وارد کنید');return;}
    const email=raw.includes('@')?raw:(raw.toLowerCase().replace(/\s+/g,'')+'@staff.local');
    $('loBtn').disabled=true;
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    $('loBtn').disabled=false;
    if(error){showLogin('ورود ناموفق: نام‌کاربری/ایمیل یا رمز اشتباه است.');return;}
    $('loginGate').style.display='none';$('loadingGate').style.display='flex';
    await afterLogin(data.session);
  };
  $('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload();};
  initAuth();
}
</script>
