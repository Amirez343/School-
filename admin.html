<script>
const SUPA_URL='https://kskipnhpcxrcgpghurct.supabase.co';
const SUPA_KEY='sb_publishable_oYXKVBx7Zd04UuKWcEmpbQ_s70EI1iJ';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('toast');e.textContent=t;e.className=/^⚠|خطا/.test(t)?'err':/✓/.test(t)?'ok':'';e.style.animation='none';void e.offsetWidth;e.style.animation='';e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2600);}
function uid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2,10));}

const CLASSES=["ریاضی 1","ریاضی 2","انسانی"];
const COMP={morning:"آزمون صبحگاهی",weekly:"آزمون تشریحی",taraz:"تراز آزمون گزینه ۲",study:"ساعت مطالعه",logging:"ثبت مطالعه",quality:"کیفیت مطالعه",classroom:"انضباط و تکالیف کلاسی"};
const DEF_CFG={weights:{morning:15,weekly:15,taraz:10,study:20,logging:10,quality:15,classroom:15},tarazMin:3000,tarazMax:9000,defaults:{q:'',h:'',s:'',lg:'',hw:1,ex:''},goal:2,goalByClass:{},thresholds:{excellent:85,good:70,attention:55},drop:10,penalty:5,
  cardMsg:{e:{t:'',s:''},g:{t:'',s:''},a:{t:'',s:''},f:{t:'',s:''},u:{t:'',s:''}}};

function mergeCfg(saved){
  saved=saved||{};const c=Object.assign({},DEF_CFG,saved);
  c.weights=Object.assign({},DEF_CFG.weights,saved.weights||{});
  c.defaults=Object.assign({},DEF_CFG.defaults,saved.defaults||{});
  c.thresholds=Object.assign({},DEF_CFG.thresholds,saved.thresholds||{});
  c.cardMsg=Object.assign({},DEF_CFG.cardMsg,saved.cardMsg||{});
  return c;
}
function parseHM(raw){const t=String(raw||'').trim().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));if(t==='')return null;
  if(!/^\d{1,2}(\.\d{1,2})?$/.test(t))return{invalid:true};const a=t.split('.'),h=+a[0],m=a[1]!=null?+a[1]:0;
  if(h>24||m>59)return{invalid:true};return{value:h+m/60};}
let GROUPS=[],STAFF=[],ASSIGN=[],STUDENTS=[],CFG=null;
const STAFF_DOMAIN='@staff.local'; // ایمیل داخلی و نامرئی؛ مسئولین فقط نام‌کاربری وارد می‌کنند
function usernameToEmail(u){return u.trim().toLowerCase().replace(/\s+/g,'')+STAFF_DOMAIN;}
function validUsername(u){return /^[a-z0-9_.]{3,30}$/i.test(u.trim());}

function showLogin(err){
  $('loadingGate').style.display='none';
  $('loginGate').style.display='flex';
  const el=$('loginErr');
  if(err){el.style.display='block';el.textContent=err;}else{el.style.display='none';}
}

async function afterLogin(session){
  const {data:prof,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error||!prof||prof.role!=='admin'){
    await sb.auth.signOut();
    showLogin(prof?'این حساب دسترسی مدیر ندارد.':'این حساب در سامانه تعریف نشده.');
    return;
  }
  $('whoami').textContent='👤 '+prof.display_name;
  $('logoutBtn').style.display='';
  $('loadingGate').style.display='flex';
  try{ await loadAll(); }
  catch(e){ console.error(e); showLogin('خطا در بارگذاری اطلاعات از سرور.'); return; }
  $('loadingGate').style.display='none';
  $('loginGate').style.display='none';
  render();
}

async function loadAll(){
  const [gq,pq,aq,sq,cq]=await Promise.all([
    sb.from('groups').select('*').order('name'),
    sb.from('profiles').select('*').order('display_name'),
    sb.from('staff_groups').select('*'),
    sb.from('students').select('id,name,cls,group_id,active,goal'),
    sb.from('cfg').select('*').eq('id',1).maybeSingle()
  ]);
  for(const r of [gq,pq,aq,sq,cq]) if(r.error) throw r.error;
  GROUPS=gq.data||[];
  STAFF=(pq.data||[]).filter(p=>p.role!=='admin');
  ASSIGN=aq.data||[];
  STUDENTS=sq.data||[];
  CFG=mergeCfg(cq.data&&cq.data.data);
}
function groupsOf(staffId){return ASSIGN.filter(a=>a.staff_id===staffId).map(a=>GROUPS.find(g=>g.id===a.group_id)).filter(Boolean);}
function studentsOfGroup(gid){return STUDENTS.filter(s=>s.group_id===gid);}

function render(){
  const unassigned=STUDENTS.filter(s=>!s.group_id&&s.active!==false);
  const c=CFG;
  $('view').innerHTML=`
  <div class="grid4">
   <div class="card stat" style="margin:0"><div class="mu">دانش‌آموزان فعال</div><div class="statv">${STUDENTS.filter(s=>s.active!==false).length}</div></div>
   <div class="card stat" style="margin:0"><div class="mu">زیرگروه‌ها</div><div class="statv">${GROUPS.length}</div></div>
   <div class="card stat" style="margin:0"><div class="mu">مسئولین</div><div class="statv">${STAFF.length}</div></div>
   <div class="card stat${unassigned.length?' warn':''}" style="margin:0"><div class="mu">دانش‌آموزان بدون زیرگروه</div><div class="statv" style="color:${unassigned.length?'var(--bad)':'inherit'}">${unassigned.length}</div></div>
  </div>

  <div class="card"><h3>👥 زیرگروه‌ها (برای تقسیم دانش‌آموزان بین مسئولین)</h3>
   <div class="row"><div class="f"><label>نام زیرگروه جدید</label><input id="ngName" placeholder="مثلاً گروه الف"></div><button class="btn p" id="ngAdd">+ افزودن</button></div>
   <table><thead><tr><th>نام</th><th>تعداد دانش‌آموز</th><th>مسئول(ین)</th><th></th></tr></thead><tbody>
   ${GROUPS.map(g=>'<tr><td>'+esc(g.name)+'</td><td>'+studentsOfGroup(g.id).length+'</td><td>'+(STAFF.filter(p=>groupsOf(p.id).some(x=>x.id===g.id)).map(p=>esc(p.display_name)).join('، ')||'<span class="mu">—</span>')+'</td><td><button class="btn d small" data-del="'+g.id+'">حذف</button></td></tr>').join('')||'<tr><td colspan="4" class="mu">هنوز زیرگروهی تعریف نشده.</td></tr>'}
   </tbody></table>
  </div>

  <div class="card"><h3>🧑‍🏫 مسئولین (کاربرانی که فقط به زیرگروه خودشان دسترسی دارند)</h3>
   <button class="btn p" id="addStaffBtn">+ افزودن مسئول جدید</button>
   <table style="margin-top:12px"><thead><tr><th>نام</th><th>نام‌کاربری ورود</th><th>زیرگروه‌های تحت مسئولیت</th><th></th></tr></thead><tbody>
   ${STAFF.map(p=>'<tr data-id="'+p.id+'"><td>'+esc(p.display_name)+'</td><td class="mu">'+esc(p.username||'—')+'</td><td>'+(groupsOf(p.id).map(g=>'<span class="chip">'+esc(g.name)+'</span>').join('')||'<span class="mu">بدون زیرگروه</span>')+'</td><td style="display:flex;gap:6px"><button class="btn small" data-edit="'+p.id+'">ویرایش زیرگروه‌ها</button><button class="btn d small" data-rm="'+p.id+'">حذف دسترسی</button></td></tr>').join('')||'<tr><td colspan="4" class="mu">هنوز مسئولی اضافه نشده.</td></tr>'}
   </tbody></table>
   <p class="mu" style="margin-top:8px">«حذف دسترسی» فقط پروفایل و زیرگروه‌های او را حذف می‌کند. برای حذف کامل امکان ورود، در پنل Supabase، بخش Authentication → Users، همان حساب را پاک کنید.</p>
  </div>

  <div class="card"><h3>🎓 همه‌ی دانش‌آموزان — زیرگروه و حذف</h3>
   <div class="row"><div class="f" style="max-width:260px"><input id="stq" placeholder="جستجوی نام…"></div></div>
   <div style="max-height:420px;overflow:auto"><table><thead><tr><th>نام</th><th>کلاس</th><th>زیرگروه</th><th>وضعیت</th><th></th></tr></thead><tbody id="stBody">
   ${STUDENTS.map(s=>studentRow(s)).join('')||'<tr><td colspan="5" class="mu">دانش‌آموزی نیست.</td></tr>'}
   </tbody></table></div>
  </div>

  <details class="card" open><summary>🎛️ تنظیمات حیاتی سامانه (وزن شاخص‌ها، آستانه‌ها، پیام‌های کارنامه)</summary>
   <div style="margin-top:14px">
   <h3>وزن شاخص‌ها (مجموع باید ۱۰۰ باشد)</h3><div class="g3">${Object.keys(COMP).map(k=>'<div><label>'+COMP[k]+'</label><input type="number" id="w_'+k+'" value="'+c.weights[k]+'"></div>').join('')}</div>
   <p class="mu">اگر داده‌ی یک شاخص برای دانش‌آموزی وجود نداشته باشد، وزن آن به‌طور خودکار بین بقیه پخش می‌شود (نه صفر).</p>
   <h3 style="margin-top:14px">هدف مطالعه روزانه (ساعت)</h3><div class="g4"><div><label>پیش‌فرض مدرسه</label><input type="number" step="0.25" id="gd" value="${c.goal}"></div>${CLASSES.map((x,i)=>'<div><label>'+x+'</label><input type="number" step="0.25" id="gc'+i+'" value="'+(c.goalByClass[x]??'')+'" placeholder="پیش‌فرض"></div>').join('')}</div>
   <h3 style="margin-top:14px">آستانه‌ها و هشدارها</h3><div class="g4">
   <div><label>حداقل «عالی»</label><input type="number" id="t1" value="${c.thresholds.excellent}"></div><div><label>حداقل «خوب»</label><input type="number" id="t2" value="${c.thresholds.good}"></div><div><label>حداقل «نیاز به توجه»</label><input type="number" id="t3" value="${c.thresholds.attention}"></div>
   <div><label>افت قابل‌توجه (امتیاز)</label><input type="number" id="dr" value="${c.drop}"></div></div>
   <div class="g4" style="margin-top:10px"><div><label>جریمه هر اخراج (امتیاز)</label><input type="number" id="pn" value="${c.penalty}"></div></div>
   <h3 style="margin-top:16px">تبدیل تراز آزمون گزینه ۲ به نمره‌ی ۰ تا ۱۰۰</h3>
   <div class="g4"><div><label>ترازی که معادل ۰ است</label><input type="number" id="tzmin" value="${c.tarazMin}"></div><div><label>ترازی که معادل ۱۰۰ است</label><input type="number" id="tzmax" value="${c.tarazMax}"></div></div>
   <p class="mu">میانگین تراز دانش‌آموز در ماه به‌صورت خطی بین این دو عدد به نمره‌ی ۰ تا ۱۰۰ تبدیل می‌شود و با وزن «تراز آزمون گزینه ۲» در امتیاز کلی اثر می‌گذارد.</p>
   <h3 style="margin-top:16px">مقدار پیش‌فرض خانه‌های «ثبت روزانه» (در ردیف‌های بدون ثبت قبلی از پیش پر می‌شود؛ خالی = بدون پیش‌فرض)</h3>
   <div class="g4">
    <div><label>آزمون صبحگاهی ٪</label><input type="number" id="df_q" value="${c.defaults.q}"></div>
    <div><label>ساعت مطالعه (مثلاً 1.30)</label><input id="df_h" value="${esc(c.defaults.h)}"></div>
    <div><label>ستاره کیفیت</label><select id="df_s">${[['','— بدون پیش‌فرض —'],[0,'0'],[1,'1'],[2,'2'],[3,'3']].map(([k,l])=>'<option value="'+k+'"'+(String(c.defaults.s)===String(k)?' selected':'')+'>'+l+'</option>').join('')}</select></div>
    <div><label>دفتر مطالعه</label><select id="df_lg">${[['','— بدون پیش‌فرض —'],[1,'ثبت شد'],[0,'ثبت نشد']].map(([k,l])=>'<option value="'+k+'"'+(String(c.defaults.lg)===String(k)?' selected':'')+'>'+l+'</option>').join('')}</select></div>
    <div><label>تکلیف</label><select id="df_hw">${[['','— بدون پیش‌فرض —'],[1,'انجام داد'],[0,'انجام نداد']].map(([k,l])=>'<option value="'+k+'"'+(String(c.defaults.hw)===String(k)?' selected':'')+'>'+l+'</option>').join('')}</select></div>
    <div><label>اخراج از کلاس (منفی)</label><input type="number" min="0" id="df_ex" value="${c.defaults.ex}"></div>
   </div>
   <h3 style="margin-top:16px">پیام‌های کارنامه‌ی دانش‌آموز (دلخواه — می‌توانید خالی بگذارید)</h3>
   ${[['e','عالی'],['g','خوب'],['a','نیاز به توجه'],['f','نیازمند پیگیری'],['u','داده ناکافی']].map(([k,l])=>`<div class="row"><div class="f" style="flex:0 0 110px;align-self:center"><b>${l}</b></div>
     <div class="f"><label>عنوان کوتاه</label><input id="cmt_${k}" value="${esc(c.cardMsg[k].t)}"></div>
     <div class="f"><label>توضیح</label><input id="cms_${k}" value="${esc(c.cardMsg[k].s)}"></div></div>`).join('')}
   <button class="btn p" style="margin-top:12px" id="svc">ذخیره تنظیمات</button>
   </div>
  </details>`;

  wireEvents();
  if(window.FX)FX.afterShow({once:true});
}

function studentRow(s){
  return '<tr data-id="'+s.id+'"><td>'+esc(s.name)+'</td><td class="mu">'+esc(s.cls||'')+'</td>'
    +'<td><select class="grpSel" data-id="'+s.id+'"><option value="">— بدون زیرگروه —</option>'+GROUPS.map(g=>'<option value="'+g.id+'"'+(s.group_id===g.id?' selected':'')+'>'+esc(g.name)+'</option>').join('')+'</select></td>'
    +'<td>'+(s.active===false?'<span class="mu">غیرفعال</span>':'فعال')+'</td>'
    +'<td><button class="btn d small" data-delst="'+s.id+'">🗑 حذف</button></td></tr>';
}

function wireEvents(){
  $('ngAdd').onclick=async()=>{
    const name=$('ngName').value.trim();
    if(!name){toast('نام زیرگروه را وارد کنید');return;}
    const row={id:uid(),name};
    const {error}=await sb.from('groups').insert(row);
    if(error){toast('خطا: '+error.message);return;}
    GROUPS.push(row);$('ngName').value='';render();toast('زیرگروه اضافه شد ✓');
  };
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.del;
    if(!confirm('این زیرگروه حذف شود؟ دانش‌آموزان آن بدون زیرگروه می‌مانند.'))return;
    const {error}=await sb.from('groups').delete().eq('id',id);
    if(error){toast('خطا: '+error.message);return;}
    GROUPS=GROUPS.filter(g=>g.id!==id);ASSIGN=ASSIGN.filter(a=>a.group_id!==id);
    STUDENTS=STUDENTS.map(s=>s.group_id===id?{...s,group_id:null}:s);
    render();toast('حذف شد.');
  });
  $('addStaffBtn').onclick=()=>staffModal();
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>staffModal(b.dataset.edit));
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.rm,p=STAFF.find(x=>x.id===id);
    if(!confirm('دسترسی «'+p.display_name+'» حذف شود؟ (حساب ورودش هنوز در Supabase باقی می‌ماند)'))return;
    const {error:de}=await sb.from('staff_groups').delete().eq('staff_id',id);
    if(de){toast('خطا: '+de.message);return;}
    const {error:pe}=await sb.from('profiles').delete().eq('id',id);
    if(pe){toast('خطا: '+pe.message);return;}
    STAFF=STAFF.filter(x=>x.id!==id);ASSIGN=ASSIGN.filter(a=>a.staff_id!==id);
    render();toast('دسترسی حذف شد.');
  });
  $('stq').oninput=e=>{
    const q=e.target.value.trim();
    document.querySelectorAll('#stBody tr[data-id]').forEach(tr=>{
      const nm=tr.querySelector('td').textContent;
      tr.style.display=!q||nm.includes(q)?'':'none';
    });
  };
  document.querySelectorAll('.grpSel').forEach(sel=>sel.onchange=async e=>{
    const sid=e.target.dataset.id,gid=e.target.value||null;
    const {error}=await sb.from('students').update({group_id:gid}).eq('id',sid);
    if(error){toast('خطا: '+error.message);return;}
    STUDENTS=STUDENTS.map(s=>s.id===sid?{...s,group_id:gid}:s);
    toast('زیرگروه بروزرسانی شد ✓');
  });
  document.querySelectorAll('[data-delst]').forEach(b=>b.onclick=async()=>{
    const sid=b.dataset.delst,s=STUDENTS.find(x=>x.id===sid);
    if(!confirm('«'+s.name+'» و همه‌ی داده‌هایش (روزانه، نمرات آزمون، اقدامات) برای همیشه حذف شود؟ این کار قابل بازگشت نیست.'))return;
    if(prompt('برای تأیید نهایی، نام دانش‌آموز را دقیقاً تایپ کنید:')!==s.name){toast('نام مطابقت نداشت؛ حذف انجام نشد.');return;}
    const {error}=await sb.from('students').delete().eq('id',sid);
    if(error){toast('خطا: '+error.message);return;}
    STUDENTS=STUDENTS.filter(x=>x.id!==sid);
    render();toast('دانش‌آموز حذف شد.');
  });
  $('svc').onclick=async()=>{
    const w={};let t=0;Object.keys(COMP).forEach(k=>{w[k]=+$('w_'+k).value||0;t+=w[k];});
    if(Math.round(t)!==100){alert('مجموع وزن‌ها '+t+' است؛ باید دقیقاً ۱۰۰ باشد.');return;}
    const t1=+$('t1').value,t2=+$('t2').value,t3=+$('t3').value;
    if(!(t1>t2&&t2>t3)){alert('ترتیب آستانه‌ها باید عالی > خوب > نیاز به توجه باشد.');return;}
    const gb={};CLASSES.forEach((x,i)=>{const v=$('gc'+i).value;if(v!=='')gb[x]=+v;});
    const cardMsg={};['e','g','a','f','u'].forEach(k=>{cardMsg[k]={t:$('cmt_'+k).value.trim(),s:$('cms_'+k).value.trim()};});
    const tzmin=+$('tzmin').value,tzmax=+$('tzmax').value;
    if(!(tzmax>tzmin)){alert('تراز معادل ۱۰۰ باید بزرگ‌تر از تراز معادل ۰ باشد.');return;}
    let dh=$('df_h').value.trim();if(dh!==''){const pp=parseHM(dh);if(!pp||pp.invalid){alert('فرمت ساعت پیش‌فرض نامعتبر است (مثال: 1.30).');return;}}
    const defaults={q:$('df_q').value.trim(),h:dh,s:$('df_s').value,lg:$('df_lg').value,hw:$('df_hw').value,ex:$('df_ex').value.trim()};
    const cfg=Object.assign({},CFG,{tarazMin:tzmin,tarazMax:tzmax,defaults,weights:w,goal:+$('gd').value||2,goalByClass:gb,thresholds:{excellent:t1,good:t2,attention:t3},drop:+$('dr').value||10,penalty:+$('pn').value||0,cardMsg});
    $('svc').disabled=true;
    const {error}=await sb.from('cfg').update({data:cfg}).eq('id',1);
    $('svc').disabled=false;
    if(error){toast('خطا: '+error.message);return;}
    CFG=cfg;toast('تنظیمات ذخیره شد ✓');
  };
}

function staffModal(staffId){
  const existing=staffId?STAFF.find(p=>p.id===staffId):null;
  const curGroups=new Set(existing?groupsOf(staffId).map(g=>g.id):[]);
  const bg=document.createElement('div');bg.className='mbg';
  bg.innerHTML=`<div class="modal">
   <h3>${existing?'ویرایش زیرگروه‌های مسئول':'افزودن مسئول جدید'}</h3>
   ${existing?'':`<div class="row"><div class="f"><label>نام نمایشی</label><input id="spN"></div></div>
   <div class="row"><div class="f"><label>نام‌کاربری ورود (فقط حروف انگلیسی/عدد، بدون فاصله)</label><input id="spU" placeholder="مثلاً sara_ahmadi"></div></div>
   <div class="row"><div class="f"><label>رمز عبور موقت</label><input id="spP" type="text" placeholder="حداقل ۶ کاراکتر"></div></div>
   <p class="mu">این نام‌کاربری و رمز را به مسئول بدهید تا در سامانه اصلی وارد شود (نیازی به ایمیل ندارد).</p>`}
   <div class="row"><div class="f"><label>زیرگروه(های) تحت مسئولیت</label>
   ${GROUPS.map(g=>'<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx);margin-bottom:4px"><input type="checkbox" value="'+g.id+'" class="grpChk" '+(curGroups.has(g.id)?'checked':'')+'> '+esc(g.name)+'</label>').join('')||'<span class="mu">ابتدا یک زیرگروه بسازید.</span>'}
   </div></div>
   <div style="display:flex;gap:8px;margin-top:10px"><button class="btn p" id="ok">ذخیره</button><button class="btn" id="no">انصراف</button></div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#no').onclick=()=>bg.remove();
  bg.querySelector('#ok').onclick=async()=>{
    const selectedGroups=[...bg.querySelectorAll('.grpChk:checked')].map(c=>c.value);
    const okBtn=bg.querySelector('#ok');okBtn.disabled=true;
    let staffUid=staffId;
    if(!existing){
      const name=bg.querySelector('#spN').value.trim();
      const username=bg.querySelector('#spU').value.trim();
      const pass=bg.querySelector('#spP').value;
      if(!name||!validUsername(username)||pass.length<6){toast('نام، نام‌کاربری معتبر (۳ تا ۳۰ حرف/عدد انگلیسی) و رمز حداقل ۶ کاراکتری را کامل وارد کنید');okBtn.disabled=false;return;}
      const email=usernameToEmail(username);
      // ساخت کاربر با یک نشست موقت و جداگانه، تا نشست ورود مدیر کل دست‌نخورده بماند
      const tempClient=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
      const {data,error}=await tempClient.auth.signUp({email,password:pass});
      if(error){toast(error.message.includes('already')?'این نام‌کاربری قبلاً استفاده شده.':'خطا در ساخت حساب: '+error.message);okBtn.disabled=false;return;}
      staffUid=data.user.id;
      const {error:pe}=await sb.from('profiles').insert({id:staffUid,display_name:name,role:'staff',username});
      if(pe){toast('خطا در ثبت پروفایل: '+pe.message);okBtn.disabled=false;return;}
      STAFF.push({id:staffUid,display_name:name,role:'staff',username});
    }
    const {error:de}=await sb.from('staff_groups').delete().eq('staff_id',staffUid);
    if(de){toast('خطا: '+de.message);okBtn.disabled=false;return;}
    ASSIGN=ASSIGN.filter(a=>a.staff_id!==staffUid);
    if(selectedGroups.length){
      const rows=selectedGroups.map(gid=>({staff_id:staffUid,group_id:gid}));
      const {error:ie}=await sb.from('staff_groups').insert(rows);
      if(ie){toast('خطا: '+ie.message);okBtn.disabled=false;return;}
      ASSIGN.push(...rows);
    }
    bg.remove();render();toast('ذخیره شد ✓');
  };
}

async function initAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showLogin();return;}
  await afterLogin(session);
}
$('loBtn').onclick=async()=>{
  const email=$('loE').value.trim(),pass=$('loP').value;
  if(!email||!pass){showLogin('ایمیل و رمز را وارد کنید');return;}
  $('loBtn').disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  $('loBtn').disabled=false;
  if(error){showLogin('ورود ناموفق: ایمیل یا رمز اشتباه است.');return;}
  $('loginGate').style.display='none';$('loadingGate').style.display='flex';
  await afterLogin(data.session);
};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload();};
initAuth();
</script>
